<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit — a plaza that becomes a QR code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@380;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <article class="card">
        <header class="intro">
          <div class="title-row">
            <span class="mark" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="3.2" />
                <ellipse cx="16" cy="16" rx="12" ry="5.2" transform="rotate(-28 16 16)" />
              </svg>
            </span>
            <h1>Orbit</h1>
            <div class="modes" role="group" aria-label="Scene">
              <button class="on" type="button" data-theme="day" aria-pressed="true">Day</button>
              <button type="button" data-theme="night" aria-pressed="false">Night</button>
            </div>
          </div>
        </header>
        <div id="stage" class="stage">
          <canvas id="view" tabindex="0" role="button" aria-label="Toggle between the tree and the QR code"></canvas>
          <p id="empty" class="empty" hidden>Add a link and the tree will grow.</p>
        </div>
        <div class="dock">
          <button id="hint" class="hint" type="button">Scroll down for the code</button>
          <div class="link-row">
            <label class="sr" for="link">Link to encode</label>
            <span class="field">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.1.1l2.2-2.2a5 5 0 0 0-7.1-7.1l-1.2 1.2" />
                <path d="M14 11a5 5 0 0 0-7.1-.1L4.7 13a5 5 0 0 0 7.1 7.1l1.2-1.2" />
              </svg>
              <input
                id="link"
                type="text"
                inputmode="url"
                spellcheck="false"
                autocomplete="off"
                placeholder="https://example.com"
                value="https://example.com"
              />
            </span>
            <button id="download" class="icon-button" type="button" aria-label="Download QR code">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 4v10" />
                <path d="M7.5 10.5 12 15l4.5-4.5" />
                <path d="M5 19h14" />
              </svg>
            </button>
          </div>
          <div class="seasons nature" role="group" aria-label="Season">
            <button class="on" type="button" data-season="spring" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9" /><path d="M12 13c-3-1-5-3.5-5-6 3 .2 5 2.2 5 6Z" /><path d="M12 13c3-1 5-3.5 5-6-3 .2-5 2.2-5 6Z" /></svg>
              Spring
            </button>
            <button type="button" data-season="summer" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18" /></svg>
              Summer
            </button>
            <button type="button" data-season="autumn" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20c4-4 5-8 4-12-4 1-6 4-4 12Z" /><path d="M12 20c-3-3-6-4-8-3 2-3 5-4 8-2" /></svg>
              Autumn
            </button>
            <button type="button" data-season="winter" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 7.5l14 9M19 7.5l-14 9" /></svg>
              Winter
            </button>
          </div>
          <div class="tints nature" role="group" aria-label="Blossom color">
            <button class="on" type="button" data-tint="#e989a8" style="--dot: #e989a8" aria-label="Pink" aria-pressed="true"></button>
            <button type="button" data-tint="#d24b4b" style="--dot: #d24b4b" aria-label="Red" aria-pressed="false"></button>
            <button type="button" data-tint="#7d6bb5" style="--dot: #7d6bb5" aria-label="Purple" aria-pressed="false"></button>
            <button type="button" data-tint="#e39b3a" style="--dot: #e39b3a" aria-label="Amber" aria-pressed="false"></button>
            <button type="button" data-tint="#3c7fd4" style="--dot: #3c7fd4" aria-label="Blue" aria-pressed="false"></button>
            <button type="button" data-tint="#5f9a55" style="--dot: #5f9a55" aria-label="Green" aria-pressed="false"></button>
          </div>
          <div class="picture-row">
            <label for="picture">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V7" /><path d="M8.5 10.5 12 7l3.5 3.5" /><path d="M6 17.5h12" /></svg>
              Drop an image
            </label>
            <input id="picture" class="sr" type="file" accept="image/*" />
            <button id="clear-picture" type="button" hidden>Remove picture</button>
          </div>
          <p id="status" class="status" hidden></p>
        </div>
      </article>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
